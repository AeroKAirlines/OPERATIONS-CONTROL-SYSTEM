<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Aero K 예약률 모니터링</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/portal_static/css/portal_style.css">
    <link rel="stylesheet" href="/booking/static/css/style.css">
    <style>
        .icon { display: inline-block; width: 20px; height: 20px; vertical-align: middle; }
        .header-icon { width: 18px; height: 18px; opacity: 0.7; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        .top-search-bar {
            background: #fff;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: center;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }
        .view-toggle button {
            padding: 6px 12px;
            font-size: 14px;
        }
        .date-picker-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-search {
            background: #fca311;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-search:hover {
            background: #e5940f;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/" style="display:flex; align-items:center; text-decoration:none;">
                <img src="/portal_static/img/AeroK.svg" alt="Aero K Logo" style="height: 28px; margin-right: 12px; width: auto;">
                <span style="font-size: 18px; font-weight: 700; color: #142a59; border-left: 2px solid #ddd; padding-left: 12px; letter-spacing: 0px;">Operations Control Center</span>
            </a>
        </div>
        
        <div class="nav-links">
            <a href="/booking" style="color:#fca311; font-weight:bold;">예약 현황</a>
            <a href="/checklist">비행계획</a>
            <a href="/ramp/ui">주기장 관리</a>
        </div>

        <div class="header-right">
            <a href="#"><svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg> 이벤트</a>
            <a href="#"><svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 자주 묻는 질문</a>
            <a href="#"><svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> 로그아웃</a>
        </div>
    </header>

    <div class="top-search-bar">
        <div class="controls">
            <div class="view-toggle">
                <button id="btn-view-default" class="active" onclick="switchView('default')">목적지별</button>
                <button id="btn-view-kal" onclick="switchView('kal')">통합 스케줄</button>
            </div>
            
            <span style="color:#ccc; margin: 0 5px;">|</span>
            
            <div class="view-toggle">
                <button id="btn-mode-lf" class="active" onclick="switchMode('lf')">예약률(%)</button>
                <button id="btn-mode-pax" onclick="switchMode('pax')">예약수(명)</button>
            </div>

            <span style="color:#ccc; margin: 0 5px;">|</span>

            <div class="view-toggle" style="border-color: #fca311;">
                <button id="btn-region-all" class="active" onclick="switchRegion('all')">전체</button>
                <button id="btn-region-0" onclick="switchRegion(0)">국내</button>
                <button id="btn-region-1" onclick="switchRegion(1)">일본</button>
                <button id="btn-region-2" onclick="switchRegion(2)">동북아</button>
                <button id="btn-region-3" onclick="switchRegion(3)">동남아</button>
            </div>
            
            <span style="color:#ccc; margin: 0 5px;">|</span>
            
            <div class="date-picker-group">
                <input type="date" id="start-date" style="padding: 8px 12px; border: none; border-bottom: 2px solid #ccc; font-size: 14px; background: transparent; outline: none; font-weight: bold; color: #333;">
                <button class="btn-search" onclick="renderDashboard()">15일 조회</button>
            </div>
        </div>
    </div>

    <main id="dashboard-container">
        <div class="legend-box">
            <div class="legend-item"><div class="color-box bg-low"></div> ~70%</div>
            <div class="legend-item"><div class="color-box bg-mid"></div> 70~80%</div>
            <div class="legend-item"><div class="color-box bg-good"></div> 80~90%</div>
            <div class="legend-item"><div class="color-box bg-high"></div> 90~99%</div>
            <div class="legend-item"><div class="color-box bg-full"></div> 100% 이상</div>
        </div>

        <div id="dashboard">
            <div style="text-align:center; padding: 50px; color:#666;">데이터를 불러오는 중입니다...</div>
        </div>
    </main>

    <script src="/booking/static/js/main.js"></script>
</body>
</html>
