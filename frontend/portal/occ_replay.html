<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Aero_K Map Replay</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/portal_static/css/portal_style.css">
    <link rel="stylesheet" href="/portal_static/css/dashboard_map.css">
    <link rel="stylesheet" href="/portal_static/css/dashboard_ofp.css">
    <link rel="stylesheet" href="/portal_static/css/replay/replay.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="ops-header">
        <a href="/" class="logo-title" style="text-decoration: none; cursor: pointer;">
            <img src="/portal_static/img/AeroK.svg" alt="Aero K" class="logo-img">
            <h1><span class="occ-text">REPLAY</span> MAP</h1>
        </a>
        <div class="header-right">
            <a href="/" class="modern-btn secondary">BACK TO LIVE</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="replay-main">
        <!-- Search & Info Sidebar -->
        <aside class="replay-sidebar">
            <div class="search-box">
                <h3>Select Flight</h3>
                <div class="search-inputs">
                    <div class="input-group">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <input type="date" id="search-date" class="modern-input">
                    </div>
                    <div class="input-group">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-flight" placeholder="Filter Flight No... (e.g. 123)" class="modern-input">
                    </div>
                </div>
            </div>
            
            <div id="search-results" class="flight-results-container">
                <!-- Results go here -->
            </div>
            
            <!-- Flight info panel moved to map overlay -->
        </aside>

        <!-- Map Container -->
        <section class="replay-map-container">
            <div id="flight-info-wrapper" class="layer-control-wrapper" style="display: none; top: 20px; left: 20px; right: auto; align-items: flex-start;">
                <button id="btn-info-toggle" class="layer-toggle-btn active" title="Flight Info">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </button>

                <div id="flight-info-panel" class="glass-panel" style="width: 280px; margin-top: 0;">
                    <div class="panel-header" id="info-flight-num" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-bottom: 8px; font-size: 16px; font-weight: 800;">
                        <span>EOK---</span>
                        <button id="btn-replay-ofp" class="modern-btn secondary" style="padding: 2px 8px; font-size: 10px; display: none;">OFP 보기</button>
                    </div>
                    <div class="flight-info-list" style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                            <span style="color: #8b9bb4; font-weight: 600;">ROUTE</span>
                            <div style="display: flex; align-items: center;">
                                <span style="color: #60a5fa; font-weight: 700; font-family: 'Inter', sans-serif; letter-spacing: 0.5px;" id="info-dep">---</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" style="margin: 0 6px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                <span style="color: #60a5fa; font-weight: 700; font-family: 'Inter', sans-serif; letter-spacing: 0.5px;" id="info-arr">---</span>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                            <span style="color: #8b9bb4; font-weight: 600;">STD / STA</span>
                            <div style="display: flex; align-items: center; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; font-weight: 600;">
                                <span style="color: #e2e8f0;" id="info-std">---</span>
                                <span style="color: #475569; margin: 0 4px;">/</span>
                                <span style="color: #e2e8f0;" id="info-sta">---</span>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                            <span style="color: #8b9bb4; font-weight: 600;">ATD / ATA</span>
                            <div style="display: flex; align-items: center; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; font-weight: 600;">
                                <span style="color: #fca311;" id="info-atd">---</span>
                                <span style="color: #475569; margin: 0 4px;">/</span>
                                <span style="color: #fca311;" id="info-ata">---</span>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                            <span style="color: #8b9bb4; font-weight: 600;">AIRCRAFT</span>
                            <span style="color: #e2e8f0; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; font-weight: 700;" id="info-reg">---</span>
                        </div>
                    </div>
                    
                    <div class="panel-divider"></div>
                    
                    <div class="panel-header" style="font-size: 11px; color: #94a3b8; border: none; padding: 0; margin-bottom: 6px;">FUEL LOG (FOB)</div>
                    <div class="flight-info-list" style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                            <span style="color: #8b9bb4; font-weight: 600;">OUT / OFF</span>
                            <div style="display: flex; align-items: center; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; font-weight: 600;">
                                <span style="color: #e2e8f0;" id="info-out-fob">---</span>
                                <span style="color: #475569; margin: 0 4px;">/</span>
                                <span style="color: #e2e8f0;" id="info-off-fob">---</span>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                            <span style="color: #8b9bb4; font-weight: 600;">ON / IN</span>
                            <div style="display: flex; align-items: center; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; font-weight: 600;">
                                <span style="color: #e2e8f0;" id="info-on-fob">---</span>
                                <span style="color: #475569; margin: 0 4px;">/</span>
                                <span style="color: #e2e8f0;" id="info-in-fob">---</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="map-layer-control" class="layer-control-wrapper">
                <button id="btn-layer-toggle" class="layer-toggle-btn" title="Map Layers & Filters">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 12 12 17 22 12"></polyline>
                        <polyline points="2 17 12 22 22 17"></polyline>
                    </svg>
                </button>

                <div id="map-controls" class="glass-panel" style="display: none;">
                    <div class="panel-header">MAP STYLE</div>
                    <select id="replay-map-style" style="background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 6px 8px; width: 100%; outline: none; font-size: 11px; margin-bottom: 8px; cursor: pointer;">
                        <option value="dark">다크 지도 (Dark)</option>
                        <option value="light">라이트 지도 (Light)</option>
                        <option value="normal">일반 지도 (Normal)</option>
                        <option value="topo">지형도 (Terrain)</option>
                        <option value="topo_color">지형도 (Topo/Color)</option>
                        <option value="satellite">위성 지도 (Satellite)</option>
                    </select>

                    <label class="custom-checkbox-label" style="margin-bottom: 4px;">
                        <input type="checkbox" id="toggle-map-labels" checked> 
                        <span class="checkmark"></span>
                        <span class="label-text">SHOW MAP LABELS</span>
                    </label>

                    <div class="panel-divider"></div>

                    <div class="panel-header">LAYERS & FILTERS</div>
                    
                    <label class="custom-checkbox-label">
                        <input type="checkbox" id="toggle-fix-master"> 
                        <span class="checkmark"></span>
                        <span class="label-text">FIX DISPLAY</span>
                    </label>
                    <div class="sub-options">
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-fix-name" checked> <span class="checkmark"></span><span class="label-text">NAME</span></label>
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-fix-efob" checked> <span class="checkmark"></span><span class="label-text">EFOB</span></label>
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-fix-time" checked> <span class="checkmark"></span><span class="label-text">TIME</span></label>
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-fix-alt" checked> <span class="checkmark"></span><span class="label-text">ALTITUDE (FL)</span></label>
                    </div>

                    <div class="panel-divider"></div>

                    <label class="custom-checkbox-label">
                        <input type="checkbox" id="toggle-acars-master" checked> 
                        <span class="checkmark"></span>
                        <span class="label-text">ACARS DISPLAY</span>
                    </label>
                    <div class="sub-options">
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-acars-fob" checked> <span class="checkmark"></span><span class="label-text">FOB</span></label>
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-acars-time" checked> <span class="checkmark"></span><span class="label-text">TIME</span></label>
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-acars-alt" checked> <span class="checkmark"></span><span class="label-text">ALT</span></label>
                        <label class="custom-checkbox-label"><input type="checkbox" id="toggle-acars-speed" checked> <span class="checkmark"></span><span class="label-text">SPEED</span></label>
                    </div>
                    
                    <div class="panel-divider"></div>
                    <label class="custom-checkbox-label">
                        <input type="checkbox" id="toggle-ac-tooltip" checked> 
                        <span class="checkmark"></span>
                        <span class="label-text">DATA BLOCK ALWAYS ON</span>
                    </label>
                </div>
            </div>

            <div id="map" class="replay-map"></div>
        </section>
    </main>

    <!-- Timeline / Playback Slider -->
    <footer class="replay-timeline">
        <div class="playback-controls">
            <button id="btn-play-pause" class="btn-play" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="playback-options">
                <select id="playback-speed" class="speed-select" disabled>
                    <option value="1">1x</option>
                    <option value="5">5x</option>
                    <option value="10">10x</option>
                    <option value="30">30x</option>
                    <option value="60">60x</option>
                </select>
                <label class="smooth-toggle" title="Smooth 1-minute interpolation">
                    <input type="checkbox" id="toggle-interpolation"> 
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">SMOOTH</span>
                </label>
            </div>
        </div>
        </div>
        
        <div class="timeline-wrapper">
            <div class="timeline-labels">
                <span id="time-start" class="time-bound">OUT: --:--</span>
                <span id="time-current" class="time-current">--:--:--</span>
                <span id="time-end" class="time-bound">IN: --:--</span>
            </div>
            <div class="range-slider-container">
                <input type="range" id="timeline-slider" min="0" max="100" value="100" class="modern-range" disabled>
            </div>
        </div>
    </footer>

    <!-- OFP Modal -->
    <div id="ofp-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-flight-num">FLIGHT</h3>
                <button class="close-btn" id="btn-close-modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-ofp-details">
                Loading...
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/portal_static/js/config.js"></script>
    <script src="/portal_static/js/dashboard_ofp.js"></script>
    <script src="/portal_static/js/replay/replay_main.js"></script>
    <script src="/portal_static/js/replay/replay_map.js"></script>
</body>
</html>
