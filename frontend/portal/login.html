<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Aero K OCC - Login</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body { background-color: #070d1a; color: white; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #0e1931; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 350px; }
        h2 { color: #fca311; letter-spacing: 2.5px; margin-bottom: 30px; margin-top: 0; white-space: nowrap; font-size: 15px; font-weight: 500; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #142a59; border-radius: 4px; background: #1a2942; color: white; box-sizing: border-box; font-family: inherit; font-size: 14px; font-weight: 300; }
        button { width: 100%; padding: 12px; background: #fca311; color: white; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 14px; letter-spacing: 1px; }
        button:hover { background: #e08c0a; }
        .test-notice { font-size: 11px; color: #8b9bb4; margin-bottom: 15px; text-align: left; }
        
        /* Success Animation Overlay */
        #success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #070d1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        #success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        #success-overlay img {
            width: 200px;
            margin-bottom: 30px;
        }
        #success-overlay h1 {
            color: #ffffff;
            font-size: 28px;
            letter-spacing: 2px;
            text-align: center;
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="success-overlay">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="/portal_static/img/AeroK.svg" alt="Aero_K Logo" style="width: 150px; margin: 0; filter: brightness(0) invert(1);">
            <h1 style="font-size: 22px; margin-top: 2px;">OPERATIONS CONTROL CENTER</h1>
        </div>
    </div>
    <div class="login-box">
        <img src="/portal_static/img/AeroK.svg" alt="Aero_K Logo" style="width: 150px; margin-bottom: 25px; filter: brightness(0) invert(1);">
        <h2>OPERATIONS CONTROL SYSTEM</h2>
        <div class="test-notice">※ 테스트용 계정이 자동 입력되어 있습니다.</div>
        <form id="loginForm">
            <!-- value 속성에 테스트 계정 고정 -->
            <input type="text" id="username" placeholder="사번 / ID" value="eokocc" required>
            <input type="password" id="password" placeholder="비밀번호" value="Qwer123!" required>
            <button type="submit">LOGIN</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append("username", document.getElementById('username').value);
            formData.append("password", document.getElementById('password').value);

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('occ_token', data.access_token);
                localStorage.setItem('occ_user', data.full_name);
                
                // Show success animation overlay
                const overlay = document.getElementById('success-overlay');
                overlay.classList.add('active');
                
                // Wait, then fade out and redirect
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000); // Changed to 2000ms for transition
            } else {
                alert("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");
            }
        });
    </script>
</body>
</html>
